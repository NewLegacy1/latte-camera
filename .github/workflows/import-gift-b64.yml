name: import-gift-b64
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-gift-b64.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch gift b64 bundle and update image-b64
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gift-bundle.json \
            'https://tmpfiles.org/dl/1794797087.e6ab6a054fb31920/w4A7yRaDrUaw/gift-bundle.json'
          python3 <<'PY'
          import json, pathlib, hashlib
          root = pathlib.Path('.')
          bundle = json.loads(pathlib.Path('/tmp/gift-bundle.json').read_text())
          for path, content in bundle['files'].items():
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content)
              print('wrote', path, len(content), hashlib.md5(content.encode()).hexdigest())
          # Drop incomplete/corrupt frother parts from earlier attempts
          b64 = root / 'scripts/image-b64'
          for name in [
              'public__images__gift-frother.jpg.part01.b64',
              'public__images__gift-frother.jpg.part02.b64',
              'public__images__gift-frother.jpg.part03.b64',
              'public__images__gift-frother.jpg.part04.b64',
              'public__images__gift-frother.jpg.part05.b64',
              'public__images__gift-frother.jpg.part06.b64',
              'public__images__gift-refill.jpg.part02.b64',
              'public__images__gift-refill.jpg.part03.b64',
              '.gift-sync-probe.txt',
              '.gift-sync-probe2.txt',
          ]:
              p = b64 / name
              if p.exists():
                  p.unlink()
                  print('removed', name)
          man_path = b64 / 'manifest.json'
          man = json.loads(man_path.read_text()) if man_path.exists() else []
          # Keep non-gift entries, replace gift entries from bundle
          man = [e for e in man if 'gift-' not in e.get('rel', '')]
          man = bundle['manifest_patch'] + man
          man_path.write_text(json.dumps(man, indent=2) + '\n')
          print('manifest entries', len(man))
          PY
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A scripts/image-b64
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Import gift-frother and gift-refill image-b64 decode parts'
          git push
